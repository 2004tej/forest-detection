<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Detection Map</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBpBj6RFMjZD5huKTu2ecPbe-7sPz_3EWo&callback=initMap" async defer></script>
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>🔥 Fire Detection Map</h2>
    <p>Live location tracking of fire incidents</p>
    <div id="map"></div>

    <script>
        function initMap() {
            // Default center (will update with actual location)
            var defaultCenter = { lat: 20.5937, lng: 78.9629 }; // India center
            
            var map = new google.maps.Map(document.getElementById("map"), {
                zoom: 6,
                center: defaultCenter
            });

            // Get user's real-time location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        var userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };

                        map.setCenter(userLocation);
                        map.setZoom(15);

                        // User's marker
                        new google.maps.Marker({
                            position: userLocation,
                            map: map,
                            title: "Your Location",
                            icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
                        });

                        console.log("User Location: ", userLocation);
                    },
                    function() {
                        console.error("Geolocation failed.");
                    }
                );
            } else {
                console.error("Browser does not support Geolocation.");
            }

            // Example fire locations (Replace with actual data from Firebase)
            var fireLocations = [
                { lat: 28.6139, lng: 77.2090 }, // Delhi
                { lat: 19.0760, lng: 72.8777 }, // Mumbai
            ];

            // Add fire markers
            fireLocations.forEach(function(location) {
                new google.maps.Marker({
                    position: location,
                    map: map,
                    title: "🔥 Fire Detected!",
                    icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
                });
            });
        }
    </script>

</body>
</html>
